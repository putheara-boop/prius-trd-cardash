name: Build CarDash iPad Mini 2 IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile ARM64 IPA on macOS Runner
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Setup Permissions
        run: chmod +x build_cardash_mini2_ipa.sh

      - name: Compile and Package IPA
        run: |
          ./build_cardash_mini2_ipa.sh
          ls -lh CarDash-iPadMini2.ipa

      - name: Upload IPA as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarDash-iPadMini2-IPA
          path: CarDash-iPadMini2.ipa
          retention-days: 14

      - name: Create GitHub Release with CarDash-iPadMini2.ipa
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0-mini2
          name: "CarDash TRD iPad mini 2 (ARM64 / iOS 11.0+) - IPA Download"
          body: |
            ## CarDash TRD Luxury EV Smart Cockpit (iPad mini 2 / A7 / iOS 11.3)
            Compiled automatically via Xcode Clang for Apple A7 (`arm64-apple-ios11.0`).

            ### What's New:
            - **YouTube Integration:** Direct YouTube button opens in Safari smoothly.
            - **Prius Gen 3 Hybrid Telemetry:** Vgate vLinker MC+ BLE engine, 14-Block HV Battery voltages, ΔV Health estimation.
            - **AI Eco Coach & Thai Voice:** Offline Thai voice alerts for reverse gear and warnings.
            - **Offline Music Player:** Seamlessly reads all `.m4a`, `.mp3`, `.wav` files inside Sandbox `/Documents` (supports 3uTools file management).
            - **iPad Settings Shortcut:** Instant switch to iPad Settings (`UIApplicationOpenSettingsURLString`).

            ### How to Install via 3uTools on Windows:
            1. Download `CarDash-iPadMini2.ipa` below.
            2. Open **3uTools** on your PC with iPad connected via USB.
            3. Go to **Toolbox → IPA Signature** (Sign with your Apple ID).
            4. Click **Install** in 3uTools — your 11 songs in Documents will remain untouched!
          files: CarDash-iPadMini2.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
