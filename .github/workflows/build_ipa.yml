name: Build CarDash iPad Mini 2 IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile ARM64 IPA on macOS Runner
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Permissions
        run: chmod +x build_cardash_mini2_ipa.sh

      - name: Compile and Package IPA
        run: |
          ./build_cardash_mini2_ipa.sh
          ls -lh CarDash-TRD-v3.5.ipa

      - name: Upload IPA as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarDash-TRD-v3.5-IPA
          path: CarDash-TRD-v3.5.ipa
          retention-days: 14

      - name: Create GitHub Release with CarDash-TRD-v3.5.ipa
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.5-trd-cockpit
          name: "CarDash TRD v3.5 Luxury EV Smart Cockpit (ARM64 / iOS 11.0+) - IPA Download"
          body: |
            ## CarDash TRD v3.5 Luxury EV Smart Cockpit (iPad mini 2 / A7 / iOS 11.3)
            Compiled automatically via Xcode Clang for Apple A7 (`arm64-apple-ios11.0`).

            ### What's New in v3.5:
            - **WebKit Native Cockpit Shell:** Embeds the flagship HTML5 TRD Smart Cockpit directly inside the app bundle.
            - **JBL Synthesis 10-Band EQ:** Studio acoustic mastering suite with presets and Subwoofer control.
            - **Full Option Modules:** TPMS 4-Wheel monitor, Sentry Dashcam HUD, Trip Financial Calculator, Doors & Dual Climate panel.
            - **100% Edge-to-Edge:** Fullscreen landscape locked, zero screen dimming while driving.
          files: |
            CarDash-TRD-v3.5.ipa
            CarDash-iPadMini2.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
